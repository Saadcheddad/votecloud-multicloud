# Configuration Reverse Proxy Nginx pour IaaS #1 (GCP Compute Engine - backend-auth)
# Emplacement sur la VM Ubuntu : /etc/nginx/sites-available/votecloud-auth

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Masquer la version Nginx (Durcissement IaaS)
    server_tokens off;

    # En-têtes de sécurité HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Served-By "GCP-Compute-Engine-IaaS-Nginx" always;

    # Protection anti-brute-force sur la connexion
    location /api/auth/login {
        limit_req zone=auth_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
